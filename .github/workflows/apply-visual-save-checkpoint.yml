name: Apply reviewed visual and save API checkpoint

# One-time source transport; this does not publish a playable mod.
on:
  push:
    branches: [26.1.2]
    paths: [.github/workflows/apply-visual-save-checkpoint.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'Shnewbs/TFC-Foundations' && github.ref == 'refs/heads/26.1.2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@v3
        with:
          fetch-depth: 2
      - name: Apply checksum-verified source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import lzma
          import os
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          parts = [root / ('tools/porting/.visual-save-part' + str(i)) for i in range(3)]
          packed = b''.join(part.read_bytes() for part in parts)
          assert hashlib.sha256(packed).hexdigest() == '9867925d0452ce9f1a8df7f7dc082d964fa1fd2ffda13106ecc900e15fe42a09', 'Transport checksum mismatch'
          payload = json.loads(lzma.decompress(packed))
          entries = payload['files']
          assert len(entries) == 72
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^']).decode().strip() == payload['base_commit'], 'Staging parent changed'
          for entry in entries:
              name = entry['path']
              assert name.startswith(('src/main/java/net/dries007/tfc/', 'tools/porting/'))
              assert '..' not in Path(name).parts and not Path(name).is_absolute()
              path = root / name
              assert not path.is_symlink()
              if entry['before'] is None:
                  assert not path.exists(), 'New file already exists: ' + name
              else:
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == entry['before'], 'Preimage changed: ' + name
          patch = Path(os.environ['RUNNER_TEMP']) / 'tfc-visual-save-reviewed.patch'
          patch.write_text(payload['patch'])
          subprocess.run(['git', 'apply', '--check', '--index', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', '--whitespace=error-all', str(patch)], check=True)
          for entry in entries:
              assert hashlib.sha256((root / entry['path']).read_bytes()).hexdigest() == entry['after'], 'Postimage mismatch: ' + entry['path']
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines())
          assert changed == {entry['path'] for entry in entries}, 'Unexpected staged paths'
          print('Verified all 72 preimages and postimages; reviewed source applied.')
          PY
      - name: Commit reviewed source and remove transport files
        shell: bash
        run: |
          git rm -f tools/porting/.visual-save-part0 tools/porting/.visual-save-part1 tools/porting/.visual-save-part2 .github/workflows/apply-visual-save-checkpoint.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Port particle rendering and block-entity ValueIO saves; preserve sync and inventory formats'
          # Fail rather than overwriting any concurrent source changes.
          git push origin HEAD:refs/heads/26.1.2
          echo "Applied source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'This source checkpoint is not a successful full build or playable release.' >> "$GITHUB_STEP_SUMMARY"
      - name: Dispatch normal validation on the new source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref 26.1.2
