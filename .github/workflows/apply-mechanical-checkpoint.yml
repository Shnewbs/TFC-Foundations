name: Apply reviewed mechanical checkpoint

# One-time transport of tested source, not a playable-release workflow.
on:
  push:
    branches: [26.1.2]
    paths: [.github/workflows/apply-mechanical-checkpoint.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'Shnewbs/TFC-Foundations' && github.ref == 'refs/heads/26.1.2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Apply checksum-verified source
        run: python3 tools/porting/.apply-mechanical-checkpoint.py
      - name: Commit source and remove one-time transport
        shell: bash
        run: |
          git rm -f tools/porting/.mechanical-checkpoint-part{0,1} tools/porting/.apply-mechanical-checkpoint.py .github/workflows/apply-mechanical-checkpoint.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Port mechanical, boat and equine render states; preserve carried attachments and add headless regressions'
          # Never overwrite concurrent source changes.
          git push origin HEAD:refs/heads/26.1.2
          echo "Applied source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Source application does not imply a playable or successfully compiled mod.' >> "$GITHUB_STEP_SUMMARY"
      - name: Validate the applied source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref 26.1.2
