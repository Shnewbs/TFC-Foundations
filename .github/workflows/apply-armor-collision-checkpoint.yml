name: Apply equipment and collision checkpoint

on:
  push:
    branches: [26.1.2]
    paths: [.github/workflows/apply-armor-collision-checkpoint.yml]

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'Shnewbs/TFC-Foundations' && github.ref == 'refs/heads/26.1.2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply reviewed patch
        shell: bash
        run: |
          base64 -d tools/porting/.armor-collision-checkpoint.b64 > /tmp/port.patch.xz
          echo '312953d64f219fcc0b6e259ceb4d66db27b1da701926248cf19cc18f452ed8d8  /tmp/port.patch.xz' | sha256sum -c -
          xz -dc /tmp/port.patch.xz > /tmp/port.patch
          echo 'd8934c479c9791e5c1b85e8a8bd3d79e2f8db43a408bdb8e3f4b5e8a4135e4d6  /tmp/port.patch' | sha256sum -c -
          git apply --check --index --whitespace=error /tmp/port.patch
          git apply --index --whitespace=error /tmp/port.patch
          git diff --cached --check
      - name: Commit reviewed source and remove transport
        shell: bash
        run: |
          git rm -f tools/porting/.armor-collision-checkpoint.b64 .github/workflows/apply-armor-collision-checkpoint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Port armor materials and collision property API'
          git push origin HEAD:refs/heads/26.1.2
      - name: Validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref 26.1.2
