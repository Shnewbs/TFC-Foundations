name: Prepare offline port compiler

# Diagnostic build inputs only, never a playable release. The short-lived
# artifact permits exact-target javac checks on an offline development host.
on:
  workflow_dispatch:
  push:
    branches: [26.1.2]
    paths: [.github/workflows/port-toolchain.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: temurin
      - name: Resolve exact target classpath
        run: ./gradlew -I tools/porting/diagnostics.gradle writePortClasspath --no-daemon --no-configuration-cache --console=plain
      - name: Prepare bounded offline compiler inputs
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          root = Path('offline-compiler')
          jars = root / 'jars'
          jars.mkdir(parents=True)
          manifest = []
          for index, entry in enumerate(Path('port-diagnostics/classpath.txt').read_text().strip().split(os.pathsep)):
              source = Path(entry)
              if not source.is_file() or source.suffix != '.jar':
                  raise SystemExit('Unexpected non-jar classpath entry: ' + entry)
              name = f'{index:03d}-' + source.name
              target = jars / name
              shutil.copyfile(source, target)
              manifest.append({'file': 'jars/' + name, 'sha256': hashlib.sha256(target.read_bytes()).hexdigest()})
          (root / 'manifest.json').write_text(json.dumps({'commit': os.environ['GITHUB_SHA'], 'files': manifest}, indent=2) + '\n')
          # Retain the compiler, javap, and the Java modules used by isolated tests.
          subprocess.run([str(Path(os.environ['JAVA_HOME']) / 'bin/jlink'), '--add-modules',
              'java.base,java.compiler,jdk.compiler,jdk.jdeps,java.logging,java.management,jdk.unsupported,java.desktop,java.naming,java.net.http,java.sql,jdk.zipfs,jdk.jfr',
              '--strip-debug', '--no-header-files', '--no-man-pages', '--compress=zip-6', '--output', str(root / 'jdk')], check=True)
          print('Exported', len(manifest), 'SHA-256-indexed classpath jars and Java 25 compiler runtime.')
          PY
          tar -czf offline-port-compiler.tar.gz offline-compiler
      - uses: actions/upload-artifact@v4
        with:
          name: tfc-offline-compiler-${{ github.run_id }}
          path: offline-port-compiler.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
