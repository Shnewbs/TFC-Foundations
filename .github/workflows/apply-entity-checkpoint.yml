name: Apply reviewed entity checkpoint

# One-time source transport. Build and playable-release gates remain separate.
on:
  push:
    branches: [26.1.2]
    paths: [.github/workflows/apply-entity-checkpoint.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'Shnewbs/TFC-Foundations' && github.ref == 'refs/heads/26.1.2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Apply checksum-verified source
        run: python3 tools/porting/.apply-entity-checkpoint.py
      - name: Commit source and remove one-time transport
        shell: bash
        run: |
          git rm -f tools/porting/.entity-checkpoint-part0 tools/porting/.entity-checkpoint-part1 tools/porting/.entity-checkpoint-part2 tools/porting/.apply-entity-checkpoint.py .github/workflows/apply-entity-checkpoint.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Port entity persistence, brain activity factories and server lifecycle APIs; add save regressions'
          # Never overwrite a concurrent source change.
          git push origin HEAD:refs/heads/26.1.2
          echo "Applied source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Source application is not a successful mod build or playable release.' >> "$GITHUB_STEP_SUMMARY"
      - name: Validate the applied source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref 26.1.2
