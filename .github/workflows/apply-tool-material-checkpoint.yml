name: Apply reviewed tool material checkpoint

# One-time checksum-verified source transport; not a playable release.
on:
  push:
    branches: [26.1.2]
    paths: [.github/workflows/apply-tool-material-checkpoint.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'Shnewbs/TFC-Foundations' && github.ref == 'refs/heads/26.1.2'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout reviewed staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify, apply and regression-check source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '8af359f43f38eac497b7b17205db529a09887b2f'
          base64 -d tools/porting/.tool-material-checkpoint.b64 > /tmp/tfc-tool-material.patch.xz
          echo '95e6296232256fb38d1d8ef297bdc35572a11b89ede0fd1d5e92f5c060e0610d  /tmp/tfc-tool-material.patch.xz' | sha256sum --check
          xz -dc /tmp/tfc-tool-material.patch.xz > /tmp/tfc-tool-material.patch
          echo '071c2769a6cd9e39c5497ef8c80b814f0369eeec23bf8a8dce54a01d6d9801f7  /tmp/tfc-tool-material.patch' | sha256sum --check
          git apply --check --index --whitespace=error /tmp/tfc-tool-material.patch
          git apply --index --whitespace=error /tmp/tfc-tool-material.patch
          test "$(git diff --cached --name-only | wc -l)" -eq 20
          git diff --cached --check
          python3 - <<'PY'
          import sys,unittest
          sys.path.insert(0,'tools/porting')
          from run_tool_material_smoke import ToolMaterialContracts
          names=[n for n in dir(ToolMaterialContracts) if n.startswith('test_') and n != 'test_target_signature_is_native_record']
          result=unittest.TextTestRunner(verbosity=2).run(unittest.TestLoader().loadTestsFromNames(
              ['run_tool_material_smoke.ToolMaterialContracts.' + n for n in names]))
          assert result.wasSuccessful() and result.testsRun == 8
          PY
      - name: Commit source, remove temporary transport and trigger CI
        shell: bash
        run: |
          git rm -f tools/porting/.tool-material-checkpoint.b64 .github/workflows/apply-tool-material-checkpoint.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Port tool tiers and melee equipment to native 26.1.2 ToolMaterial'
          git push origin HEAD:refs/heads/26.1.2
          echo "Applied source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'This does not establish successful Gradle compilation, client launch or playability.' >> "$GITHUB_STEP_SUMMARY"
      - name: Dispatch exact-target build and resource validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref 26.1.2
