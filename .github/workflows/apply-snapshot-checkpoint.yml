name: Apply reviewed snapshot-model checkpoint

# One-time reviewed source transport, not a playable-release workflow.
on:
  push:
    branches: [26.1.2]
    paths: [.github/workflows/apply-snapshot-checkpoint.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'Shnewbs/TFC-Foundations' && github.ref == 'refs/heads/26.1.2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout exact staging commit and parent
        uses: actions/checkout@v3
        with:
          fetch-depth: 2
      - name: Apply checksum-verified source
        run: python3 tools/porting/.apply-snapshot-checkpoint.py
      - name: Commit source and remove one-time transport
        shell: bash
        run: |
          git rm -f tools/porting/.snapshot-checkpoint-part{0,1,2} tools/porting/.apply-snapshot-checkpoint.py .github/workflows/apply-snapshot-checkpoint.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Port pile, scraping and mold-table models to immutable snapshots; preserve geometry and save formats'
          # Never overwrite concurrent branch changes.
          git push origin HEAD:refs/heads/26.1.2
          echo "Applied source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Source application does not imply successful compilation or a playable release.' >> "$GITHUB_STEP_SUMMARY"
      - name: Validate the applied source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref 26.1.2
