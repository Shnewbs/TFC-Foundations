name: Apply verified worldgen API checkpoint

on:
  push:
    branches: [26.1.2]
    paths:
      - .github/workflows/apply-worldgen-api-checkpoint.yml

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'Shnewbs/TFC-Foundations' && github.ref == 'refs/heads/26.1.2'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout original source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply checksummed target patch
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = '6f47e1f792bcb3b1b3e5c76827edc950e4d61662'
          base64 --decode tools/porting/.worldgen-api-26.1.2.b64 > /tmp/worldgen-26.1.2.patch.xz
          echo '0297c4c5ef750ef2db18a88ad661082cee0daf86aa36bc4b02d8a26a7bf33591  /tmp/worldgen-26.1.2.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/worldgen-26.1.2.patch.xz > /tmp/worldgen-26.1.2.patch
          echo '5745533455af51e11f833923e3e681c2983e301409ad8fe79801444471cdc0bf  /tmp/worldgen-26.1.2.patch' | sha256sum --check
          git apply --check --index --whitespace=error /tmp/worldgen-26.1.2.patch
          git apply --index --whitespace=error /tmp/worldgen-26.1.2.patch
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          git diff --cached --check
      - name: Commit reviewed source and remove one-time files
        shell: bash
        run: |
          git rm -f tools/porting/.worldgen-api-26.1.2.b64 .github/workflows/apply-worldgen-api-checkpoint.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Port target worldgen APIs; preserve features and check resolved signatures'
          git push origin HEAD:refs/heads/26.1.2
          echo "Applied exact commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Worldgen API fixes are not a playable mod build." >> "$GITHUB_STEP_SUMMARY"
      - name: Run independent build validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref 26.1.2
