name: Release preparation

# Enable publication only after the playable-candidate gates pass and
# Foundations distribution destinations are configured.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain release prerequisites
        run: |
          echo "Publication is disabled during port preparation."
          echo "See PROJECT_STATUS.md and docs/foundations/ROADMAP.md."
          echo "Configure Foundations project IDs and validate a playable candidate first."
          exit 1
