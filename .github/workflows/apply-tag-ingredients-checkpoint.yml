name: Apply holder-backed tag ingredient checkpoint

on:
  push:
    branches: [26.1.2]
    paths: [.github/workflows/apply-tag-ingredients-checkpoint.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'Shnewbs/TFC-Foundations' && github.ref == 'refs/heads/26.1.2'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout exact history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply tag holder migration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '3f66f61a941726f47b0d45a936d76f5a0aeae21b'
          base64 -d tools/porting/.tag-ingredient-checkpoint.b64 > /tmp/tfc-tag-ingredients.patch.xz
          echo 'e6b6b6dab69838241d2bc5b21bc85d48811a330c1c838303b84127e9938b5d72  /tmp/tfc-tag-ingredients.patch.xz' | sha256sum -c -
          xz -dc /tmp/tfc-tag-ingredients.patch.xz > /tmp/tfc-tag-ingredients.patch
          echo '95c637736d968baa8ef88df59ed45d732c8336f3e460716731d514ed02ffb8e3  /tmp/tfc-tag-ingredients.patch' | sha256sum -c -
          git apply --check --index --whitespace=error /tmp/tfc-tag-ingredients.patch
          git apply --index --whitespace=error /tmp/tfc-tag-ingredients.patch
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          git diff --cached --check
          python3 -m py_compile tools/porting/run_tag_ingredient_smoke.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/main/java/net/dries007/tfc/util/DataGenerationHelpers.java').read_text()
          assert 'input(ItemLike item, int count) {return input(Ingredient.of(item), count);}' in s
          assert 'input(TagKey<Item> item, int count) {return input(RecipeHelpers.ingredient(item), count);}' in s
          assert 'run_tag_ingredient_smoke.py' in Path('tools/porting/inspect_api.py').read_text()
          print('PASS: ItemLike overload untouched; holder-backed tag usage')
          PY
      - name: Commit verified source and remove transfer files
        shell: bash
        run: |
          git rm -f tools/porting/.tag-ingredient-checkpoint.b64 .github/workflows/apply-tag-ingredients-checkpoint.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use holder-backed tag ingredients in animal goals, JEI and datagen'
          git push origin HEAD:refs/heads/26.1.2
          echo "Published source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Build and gameplay gates remain open.' >> "$GITHUB_STEP_SUMMARY"
      - name: Run target validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref 26.1.2
