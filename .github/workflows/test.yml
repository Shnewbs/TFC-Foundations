name: Validate target branch

on:
  workflow_dispatch:
  push:
    branches: [26.x, 26.1.2]
  pull_request:
    branches: [26.x, 26.1.2]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: temurin
      - name: Set up Gradle cache
        uses: gradle/gradle-build-action@v2
      - name: Build, Test, Check Licenses
        id: build
        shell: bash
        run: |
          mkdir -p port-diagnostics
          set +e
          ./gradlew -I tools/porting/diagnostics.gradle writePortClasspath compileJava compileDataJava compileTestJava build --continue --no-daemon --no-configuration-cache --console=plain > port-diagnostics/build.log 2>&1
          result=$?
          printf '%s\n' "$result" > port-diagnostics/gradle-exit-code.txt
          exit "$result"
      - name: Inspect resolved target API
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        run: python3 tools/porting/inspect_api.py
      - name: Summarize compiler diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          import pathlib
          import re

          out = pathlib.Path('port-diagnostics')
          out.mkdir(exist_ok=True)
          log = out / 'build.log'
          text = log.read_text(errors='replace') if log.exists() else 'Build log unavailable: setup or checkout failed.'
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
          lines = text.splitlines()
          pattern = re.compile(r'^\s*(.*?\.java):(\d+): (error|warning): (.*)$')
          errors = []
          seen = set()
          occurrences = 0
          for index, line in enumerate(lines):
              match = pattern.match(line)
              if not match or match[3] != 'error':
                  continue
              occurrences += 1
              path = match[1].strip().removeprefix(os.environ.get('GITHUB_WORKSPACE', '') + '/')
              key = (path, int(match[2]), match[4].strip())
              if key in seen:
                  continue
              seen.add(key)
              context = []
              for extra in lines[index + 1:index + 9]:
                  if pattern.match(extra) or extra.startswith('> Task'):
                      break
                  context.append(extra)
              errors.append({'path': key[0], 'line': key[1], 'message': key[2], 'context': context})
          groups = collections.Counter('/'.join(e['path'].split('/')[:9]) for e in errors)
          report = {
              'commit': os.environ.get('GITHUB_SHA'),
              'ref': os.environ.get('GITHUB_REF_NAME'),
              'displayed_error_count': len(errors),
              'diagnostic_occurrences': occurrences,
              'note': 'Unique displayed diagnostics are not the total migration backlog. Compiler limits and dependency failures may hide later errors.',
              'errors': errors,
              'failed_tasks': [line for line in lines if line.startswith('> Task ') and line.endswith(' FAILED')],
              'tail': lines[-45:],
          }
          (out / 'compiler-errors.json').write_text(json.dumps(report, indent=2) + '\n')
          summary = ['# Target-branch validation', '', 'Commit: `' + str(report['commit']) + '`', 'Unique displayed Java errors: **' + str(len(errors)) + '**', report['note'], '', '## Largest affected source groups']
          summary += ['- `' + key + '`: ' + str(count) for key, count in groups.most_common(12)]
          summary += ['', '## First 12 diagnostics', '```text']
          for error in errors[:12]:
              summary += [error['path'] + ':' + str(error['line']) + ': ' + error['message']] + error['context']
          summary += ['```', '', '## Build tail', '```text'] + lines[-35:] + ['```', '']
          rendered = '\n'.join(summary)
          (out / 'summary.md').write_text(rendered)
          print(rendered)
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write(rendered)
          PY
      - name: Archive exact source checkpoint
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        run: git archive --format=tar.gz --output=port-diagnostics/source.tar.gz HEAD
      - name: Upload validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tfc-port-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            port-diagnostics/
            build/reports/
            build/test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Set up Python 3.13
        if: ${{ !cancelled() }}
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install resource-validation dependencies
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --upgrade pip
          pip install -r resources/requirements.txt
      - name: Validate Resources
        if: ${{ !cancelled() }}
        run: python resources validate
