name: Validate target branch

on:
  workflow_dispatch:
  push:
    branches:
      - 26.x
      - 26.1.2
  pull_request:
    branches: [ 26.x, 26.1.2 ]

permissions:
  contents: read

jobs:
  main:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Set up JDK 25
      uses: actions/setup-java@v3
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Build, Test, Check Licenses
      uses: gradle/gradle-build-action@v2
      with:
        # Collect independent compiler/license failures even while packaging is gated.
        arguments: compileJava compileDataJava compileTestJava build --continue
    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r resources/requirements.txt
    - name: Validate Resources
      run: |
        python resources validate
