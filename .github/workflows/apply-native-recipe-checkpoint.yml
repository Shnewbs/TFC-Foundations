name: Apply native recipe serializer checkpoint

on:
  push:
    branches: [26.1.2]
    paths: [.github/workflows/apply-native-recipe-checkpoint.yml]

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'Shnewbs/TFC-Foundations' && github.ref == 'refs/heads/26.1.2'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out exact source ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply reviewed recipe migration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '67bf452d82b05e98c721ddc60cb95205a793d561'
          test "$(git rev-parse HEAD~2)" = '9d072b96cdd32c467998a2fda085c1f912b4da43'
          base64 -d tools/porting/.native-recipe-serializers-checkpoint.b64 > /tmp/tfc-recipe.patch.xz
          echo '3edd55154ac2f08b26fc044d97691aef8f2991453b8b95f9b978d0b7a3d07543  /tmp/tfc-recipe.patch.xz' | sha256sum --check
          xz -dc /tmp/tfc-recipe.patch.xz > /tmp/tfc-recipe.patch
          echo '3a5f992b371ffa78cb75d43d868c3df1c279f8d9bdd96cc6b152af4139d33789  /tmp/tfc-recipe.patch' | sha256sum --check
          git apply --check --index --whitespace=error /tmp/tfc-recipe.patch
          git apply --index --whitespace=error /tmp/tfc-recipe.patch
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git diff --cached --check
          python3 - <<'PY'
          import sys, unittest
          sys.path.insert(0, 'tools/porting')
          from run_recipe_serializer_smoke import RecipeSerializerContracts
          names = ['test_native_wrapper_was_removed', 'test_custom_singletons_are_still_singletons',
                   'test_block_recipe_serializer_uses_native_record']
          suite=unittest.TestSuite(RecipeSerializerContracts(n) for n in names)
          assert unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful()
          PY
      - name: Commit validated source and remove transport
        shell: bash
        run: |
          git rm -f tools/porting/.native-recipe-serializers-checkpoint.b64 .github/workflows/apply-native-recipe-checkpoint.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Port TFC recipe serializers to native Minecraft 26.1.2 record'
          git push origin HEAD:refs/heads/26.1.2
          echo "Applied source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Full mod compilation and runtime tests remain required." >> "$GITHUB_STEP_SUMMARY"
      - name: Run normal pinned-target CI and codec checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref 26.1.2
