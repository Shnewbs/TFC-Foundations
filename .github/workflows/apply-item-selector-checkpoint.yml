name: Apply verified TFC item selector checkpoint

on:
  push:
    branches: [26.1.2]
    paths: [.github/workflows/apply-item-selector-checkpoint.yml]

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'Shnewbs/TFC-Foundations' && github.ref == 'refs/heads/26.1.2'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout exact original history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and test checksum-pinned item selectors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'a8ae324ca058d8791a99bdc5ed1b743897733599'
          test "$(git rev-parse HEAD~2)" = 'ef83c097e0fce31f412e1d3cd6fa8df7570b8317'
          base64 -d tools/porting/.item-selector-checkpoint.b64 > /tmp/tfc-item-selectors.patch.xz
          echo '699de0608fb92fc26e59d2988cea0931221e49cfd4ab12d3e2c8b546520e5805  /tmp/tfc-item-selectors.patch.xz' | sha256sum --check
          xz -dc /tmp/tfc-item-selectors.patch.xz > /tmp/tfc-item-selectors.patch
          echo '73a3c842d2581cea2985ba5bd4aa3058780ce07f61c3a2c4e8946e1961de8b95  /tmp/tfc-item-selectors.patch' | sha256sum --check
          git apply --check --index --whitespace=error /tmp/tfc-item-selectors.patch
          git apply --index --whitespace=error /tmp/tfc-item-selectors.patch
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git diff --cached --check
          python3 tools/porting/run_item_selector_smoke.py
          python3 tools/porting/generate_item_selectors.py --output build/generated/tfcItemSelectors --report build/reports/tfcItemSelectors.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('build/reports/tfcItemSelectors.json').read_text())
          assert d['source_count'] == 5597
          assert d['generated_count'] == 5369
          assert d['manual_migration_count'] == 228
          assert len(list(Path('build/generated/tfcItemSelectors/assets/tfc/items').rglob('*.json'))) == 5369
          PY
      - name: Commit verified source and remove one-time transport
        shell: bash
        run: |
          git rm -f tools/porting/.item-selector-checkpoint.b64 .github/workflows/apply-item-selector-checkpoint.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate 26.1.2 item selectors for static models; guard custom model adapters'
          git push origin HEAD:refs/heads/26.1.2
          echo "Published source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "228 special item models still require manual 26.x adapters; no playable build claimed." >> "$GITHUB_STEP_SUMMARY"
      - name: Run normal compilation and resource validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref 26.1.2
