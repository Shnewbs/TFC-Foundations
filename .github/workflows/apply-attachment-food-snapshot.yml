name: Apply verified attachment and player survival checkpoint

on:
  push:
    branches: [26.1.2]
    paths: [.github/workflows/apply-attachment-food-snapshot.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'Shnewbs/TFC-Foundations' && github.ref == 'refs/heads/26.1.2'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out exact staging history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply checksum-guarded reviewed sources
        run: python3 tools/porting/.apply-attachment-food-snapshot.py
      - name: Commit source and remove temporary transfer files
        shell: bash
        run: |
          git rm -f tools/porting/.attachment-food-runtime-part{0,1,2,3,4} tools/porting/.apply-attachment-food-snapshot.py .github/workflows/apply-attachment-food-snapshot.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Port chunk and player saving, food runtime and native item particles'
          git push origin HEAD:refs/heads/26.1.2
          echo "Applied source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'No claim of a playable JAR or completed compilation.' >> "$GITHUB_STEP_SUMMARY"
      - name: Run normal exact-target validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref 26.1.2
