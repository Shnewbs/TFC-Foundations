# Loader metadata
modLoader = "javafml"
loaderVersion = "[4,)"
license = "EUPL-1.2"
issueTrackerURL = "https://github.com/Shnewbs/TFC-Foundations/issues"

# TFC
[[mods]]
    modId = "${modId}"
    version = "${modVersion}"
    displayName = "TFC Foundations"
    credits = "By AlcatrazEscapee, Disastermoo, Dries007, Bunsan, Claycorp, DavidTriphon, EERussianguy, Gaelmare, and many others. Based on the original work by Bioxx, Dunk, and Kitty. Music by Mike \"Menoch\" Pelaez"
    authors = "AlcatrazEscapee"
    description = '''TFC Foundations — a TerraFirmaCraft port for Minecraft 26.3.'''
    enumExtensions = "META-INF/enumextensions.json"

# Dependencies
[[dependencies.tfc]]
    modId = "patchouli"
    type = "required"
    versionRange = "${patchouliVersionRange}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.tfc]]
    modId = "jei"
    type = "optional"
    versionRange = "${jeiVersionRange}"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.tfc]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neoForgeVersionRange}"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.tfc]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraftVersionRange}"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
    config = "${modId}.mixins.json"

# We do our own biome coloring, see #2279
[mods."sodium:options"]
    "mixin.features.render.world.sky"=false
