# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx6G
org.gradle.daemon=false
org.gradle.console=plain
org.gradle.configuration-cache=true

# First Foundations 26.x candidate; not a published/playable release.
modVersion=0.0.0
minecraftVersion=26.3
neoForgeVersion=26.3.0.58-beta
jeiVersion=31.9.0.61
# patchouliVersion, emiVersion, jadeVersion and theOneProbeVersion are intentionally
# unset until target-version artifacts/adapters are verified. No legacy runtime jars.
